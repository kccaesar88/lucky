<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸運抽獎轉盤 - Lucky Wheel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
        }
        /* Pointer bounce effect */
        @keyframes pointerTick {
            0% { transform: translateY(-50%) rotate(0deg); }
            50% { transform: translateY(-50%) rotate(-18deg); }
            100% { transform: translateY(-50%) rotate(0deg); }
        }
        .pointer-tick {
            animation: pointerTick 0.12s ease-in-out;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Top Header Navigation -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 via-rose-500 to-indigo-600 flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid font-bold fa-dharmachakra text-xl animate-spin-slow"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg sm:text-xl bg-clip-text text-transparent bg-gradient-to-r from-amber-500 via-rose-500 to-indigo-600">
                        幸運抽獎輪
                    </h1>
                    <p class="text-xs text-slate-400 hidden sm:block">Wheel of Names </p>
                </div>
            </div>

            <!-- Action Tools -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <button id="fullscreenBtn" onclick="toggleFullscreen()" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="全螢幕模式">
                    <i class="fa-solid fa-expand text-lg"></i>
                </button>
                <button id="soundToggleBtn" onclick="toggleSound()" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="聲音切換">
                    <i class="fa-solid fa-volume-high text-lg" id="soundIcon"></i>
                </button>
                <button onclick="openSettingsModal()" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="轉盤設定">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
                <button id="darkModeToggle" onclick="toggleDarkMode()" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="切換深色主題">
                    <i class="fa-solid fa-moon text-lg dark:hidden"></i>
                    <i class="fa-solid fa-sun text-lg hidden dark:block text-amber-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Left Wheel Viewport (lg:col-span-7) -->
        <section class="lg:col-span-7 bg-white dark:bg-slate-800 rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col items-center justify-center relative min-h-[480px]">
            
            <!-- Canvas Container -->
            <div class="relative w-full max-w-[500px] aspect-square flex items-center justify-center my-auto">
                
                <!-- Pointer Marker (Right pointing to Center) -->
                <div id="pointerMarker" class="absolute right-[-12px] sm:right-[-16px] top-1/2 -translate-y-1/2 z-20 pointer-events-none filter drop-shadow-md origin-right transition-transform">
                    <div class="w-0 h-0 border-y-[14px] sm:border-y-[18px] border-y-transparent border-r-[28px] sm:border-r-[36px] border-r-rose-600 dark:border-r-rose-500"></div>
                </div>

                <!-- Canvas Component -->
                <canvas id="wheelCanvas" class="w-full h-full rounded-full cursor-pointer shadow-xl border-4 border-white dark:border-slate-700 transition-transform active:scale-[0.99]"></canvas>

                <!-- Center Hub Button -->
                <button id="centerBtn" onclick="spinWheel()" class="absolute inset-auto w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-white dark:bg-slate-800 border-4 border-slate-200 dark:border-slate-600 shadow-lg flex flex-col items-center justify-center text-slate-800 dark:text-slate-100 hover:scale-105 active:scale-95 transition group z-10">
                    <i class="fa-solid fa-play text-xl sm:text-2xl ml-1 text-rose-500 group-hover:text-rose-600 transition"></i>
                    <span class="text-[10px] font-bold tracking-wider uppercase text-slate-500 dark:text-slate-400 mt-0.5">SPIN</span>
                </button>
            </div>

            <!-- Spin Trigger Bar -->
            <div class="mt-6 w-full max-w-md flex gap-3">
                <button id="spinBtn" onclick="spinWheel()" class="flex-1 py-3.5 px-6 rounded-xl font-bold text-white bg-gradient-to-r from-rose-500 via-amber-500 to-indigo-600 hover:opacity-95 shadow-lg shadow-rose-500/25 active:scale-[0.98] transition flex items-center justify-center gap-2 text-lg">
                    <i class="fa-solid fa-rotate text-xl"></i>
                    <span>開始抽獎！</span>
                </button>
            </div>
        </section>

        <!-- Right Inputs & Controls Panel (lg:col-span-5) -->
        <section class="lg:col-span-5 flex flex-col gap-4">
            
            <!-- Tab Headers -->
            <div class="bg-white dark:bg-slate-800 p-1.5 rounded-xl border border-slate-200 dark:border-slate-700 flex gap-1 shadow-sm">
                <button id="tabEntriesBtn" onclick="switchTab('entries')" class="flex-1 py-2 rounded-lg font-semibold text-sm transition flex items-center justify-center gap-2 bg-slate-100 dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm">
                    <i class="fa-solid fa-list-ul"></i>
                    <span>名單項目 (<span id="entriesCount">0</span>)</span>
                </button>
                <button id="tabWinnersBtn" onclick="switchTab('winners')" class="flex-1 py-2 rounded-lg font-semibold text-sm transition flex items-center justify-center gap-2 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50">
                    <i class="fa-solid fa-trophy text-amber-500"></i>
                    <span>中獎紀錄 (<span id="winnersCount">0</span>)</span>
                </button>
            </div>

            <!-- TAB 1: Entries Input Panel -->
            <div id="entriesPanel" class="bg-white dark:bg-slate-800 rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col gap-3">
                
                <!-- Quick Operations Toolbar -->
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex items-center gap-1.5">
                        <button onclick="shuffleEntries()" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition flex items-center gap-1">
                            <i class="fa-solid fa-shuffle"></i> 隨機洗牌
                        </button>
                        <button onclick="sortEntries()" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition flex items-center gap-1">
                            <i class="fa-solid fa-arrow-down-a-z"></i> 筆劃排序
                        </button>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <label class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 cursor-pointer transition flex items-center gap-1">
                            <i class="fa-solid fa-file-import"></i> 匯入
                            <input type="file" id="importFileInput" accept=".txt,.csv" onchange="importFile(event)" class="hidden">
                        </label>
                        <button onclick="clearAllEntries()" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg text-rose-600 bg-rose-50 dark:bg-rose-950/40 dark:text-rose-400 hover:bg-rose-100 transition flex items-center gap-1">
                            <i class="fa-solid fa-trash"></i> 清空
                        </button>
                    </div>
                </div>

                <!-- Text Area Input -->
                <textarea id="entriesInput" oninput="handleEntriesChange()" placeholder="請輸入參與者名單，一行一個名字..." class="w-full h-[360px] p-3 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-rose-500 focus:border-transparent resize-none font-mono leading-relaxed outline-none transition"></textarea>

                <p class="text-xs text-slate-400 dark:text-slate-500">提示：修改文字區域會即時更新轉盤選項。</p>
            </div>

            <!-- TAB 2: Winners History Panel -->
            <div id="winnersPanel" class="hidden bg-white dark:bg-slate-800 rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col gap-3 min-h-[440px]">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">歷史紀錄</span>
                    <div class="flex gap-2">
                        <button onclick="exportWinners()" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-200 transition flex items-center gap-1">
                            <i class="fa-solid fa-download"></i> 匯出
                        </button>
                        <button onclick="clearWinners()" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 hover:bg-rose-100 transition flex items-center gap-1">
                            <i class="fa-solid fa-trash-can"></i> 清除紀錄
                        </button>
                    </div>
                </div>

                <!-- Winners List -->
                <div id="winnersList" class="flex-1 overflow-y-auto space-y-2 pr-1 max-h-[360px]">
                    <!-- Dynamically populated -->
                </div>
            </div>

        </section>
    </main>

    <!-- Winner Winner Modal -->
    <div id="winnerModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl border border-slate-200 dark:border-slate-700 text-center transform scale-90 transition-transform duration-300 flex flex-col items-center">
            
            <!-- Confetti Icon Header -->
            <div class="w-20 h-20 rounded-full bg-amber-100 dark:bg-amber-950/50 text-amber-500 flex items-center justify-center text-4xl mb-4 shadow-inner animate-bounce">
                <i class="fa-solid fa-trophy"></i>
            </div>

            <h3 class="text-sm font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">恭喜獲得大獎！</h3>
            <h2 id="winnerNameText" class="text-3xl sm:text-4xl font-black text-slate-900 dark:text-white my-4 break-all leading-tight bg-clip-text text-transparent bg-gradient-to-r from-rose-500 via-amber-500 to-indigo-600">
                ---
            </h2>

            <!-- Actions -->
            <div class="flex flex-col sm:flex-row gap-3 w-full mt-4">
                <button onclick="removeWinnerEntry()" class="flex-1 py-3 px-4 rounded-xl font-bold text-white bg-rose-500 hover:bg-rose-600 active:scale-95 transition shadow-lg shadow-rose-500/30 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-minus"></i>
                    <span>移除此選項</span>
                </button>
                <button onclick="closeWinnerModal()" class="flex-1 py-3 px-4 rounded-xl font-bold bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600 active:scale-95 transition">
                    保留並關閉
                </button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-md w-full shadow-2xl border border-slate-200 dark:border-slate-700">
            
            <div class="flex items-center justify-between pb-4 border-b border-slate-200 dark:border-slate-700 mb-4">
                <h3 class="text-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-rose-500"></i>
                    <span>轉盤設定</span>
                </h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <div class="space-y-4">
                <!-- Spin Duration Slider -->
                <div>
                    <div class="flex justify-between text-sm font-semibold mb-1">
                        <label for="spinDurationRange">旋轉時間</label>
                        <span id="spinDurationValue" class="text-rose-500">5 秒</span>
                    </div>
                    <input type="range" id="spinDurationRange" min="2" max="20" value="5" step="1" oninput="updateSpinDurationVal(this.value)" class="w-full accent-rose-500">
                </div>

                <!-- Theme Color Selector -->
                <div>
                    <label class="block text-sm font-semibold mb-2">配色主題</label>
                    <div class="grid grid-cols-2 gap-2" id="themePresetContainer">
                        <!-- Populated dynamically -->
                    </div>
                </div>

                <!-- Sound FX Options -->
                <div class="pt-2 border-t border-slate-200 dark:border-slate-700">
                    <label class="flex items-center justify-between cursor-pointer">
                        <span class="text-sm font-semibold">旋轉音效</span>
                        <input type="checkbox" id="soundEffectCheck" checked onchange="appSettings.soundEnabled = this.checked" class="w-5 h-5 accent-rose-500 rounded">
                    </label>
                </div>
            </div>

            <div class="mt-6 flex justify-end">
                <button onclick="closeSettingsModal()" class="py-2.5 px-5 rounded-xl font-bold bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 hover:opacity-90 transition">
                    套用並完成
                </button>
            </div>
        </div>
    </div>

    <script>
        /* Modern Lucky Wheel Core Application */
        
        // Initial Default Entries
        const defaultEntries = [
           "四嬸","Daniel","Terry","Ling","Ceci","二叔","二嬸","Desy","Mabel","Tiffany","Ronald","Sue","Kimberly","Alvin","卿姐",
"Anthony"
        ];

        // Color Palettes
        const colorThemes = {
            rainbow: ['#f43f5e', '#fb923c', '#facc15', '#4ade80', '#38bdf8', '#818cf8', '#c084fc'],
            macaron: ['#fecdd3', '#fed7aa', '#fef08a', '#bbf7d0', '#bae6fd', '#ddd6fe', '#fbcfe8'],
            neon: ['#ff0055', '#ff5000', '#ffcc00', '#00ff66', '#00ccff', '#9900ff', '#ff00cc'],
            sunset: ['#4c1d95', '#7c3aed', '#c026d3', '#db2777', '#ea580c', '#f59e0b'],
            emerald: ['#064e3b', '#047857', '#10b981', '#34d399', '#a7f3d0', '#0284c7']
        };

        // Application State Variables
        let entries = [...defaultEntries];
        let winners = [];
        let activeThemeKey = 'rainbow';
        let currentAngle = 0; // Radian angle of wheel
        let isSpinning = false;
        let lastWinner = null;

        let appSettings = {
            duration: 5, // in seconds
            soundEnabled: true
        };

        // Canvas element setup
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');

        // Audio Context Synthesizer (Web Audio API - No external asset dependencies)
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTick() {
                if (!appSettings.soundEnabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.04);

                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.04);
            }

            playFanfare() {
                if (!appSettings.soundEnabled) return;
                this.init();
                if (!this.ctx) return;

                const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.value = freq;

                    const startTime = this.ctx.currentTime + idx * 0.08;
                    gain.gain.setValueAtTime(0.2, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(startTime);
                    osc.stop(startTime + 0.3);
                });
            }
        }

        const audio = new SoundFX();

        // Responsive Canvas Scaling
        function resizeCanvas() {
            const container = canvas.parentElement;
            const size = Math.min(container.clientWidth, 500);
            const dpr = window.devicePixelRatio || 1;
            
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            ctx.scale(dpr, dpr);
            
            drawWheel();
        }

        // Draw the Fortune Wheel
        function drawWheel() {
            const size = canvas.width / (window.devicePixelRatio || 1);
            const centerX = size / 2;
            const centerY = size / 2;
            const radius = size / 2 - 8;

            ctx.clearRect(0, 0, size, size);

            const total = entries.length;

            if (total === 0) {
                // Empty state wheel
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fillStyle = '#e2e8f0';
                ctx.fill();
                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 16px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('請新增名單選項', centerX, centerY);
                return;
            }

            const sliceAngle = (Math.PI * 2) / total;
            const colors = colorThemes[activeThemeKey];

            for (let i = 0; i < total; i++) {
                const angle = currentAngle + i * sliceAngle;

                // Sector Arc
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + sliceAngle);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.stroke();

                // Sector Text Alignment & Drawing
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                
                // Dynamic font scaling according to items count
                let fontSize = 16;
                if (total > 30) fontSize = 10;
                else if (total > 20) fontSize = 12;
                else if (total > 12) fontSize = 14;

                ctx.font = `bold ${fontSize}px Inter, sans-serif`;
                
                // Truncate long name text
                let text = entries[i];
                if (text.length > 14) text = text.substring(0, 12) + '...';

                // Drop shadow for text readability
                ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
                ctx.shadowBlur = 4;
                ctx.fillText(text, radius - 24, 0);

                ctx.restore();
            }
        }

        let lastTickAngle = 0;

        function spinWheel() {
            if (isSpinning) return;
            if (entries.length === 0) {
                alert("請先在右側輸入框新增至少一個名字！");
                return;
            }

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('centerBtn').disabled = true;

            const duration = appSettings.duration * 1000;
            const startAngle = currentAngle;
            
            // Random spin distance: 5-8 full rotations + random angle
            const totalRotations = (Math.floor(Math.random() * 4) + 5) * Math.PI * 2;
            const randomTargetAngle = Math.random() * Math.PI * 2;
            const targetAngle = startAngle + totalRotations + randomTargetAngle;

            const startTime = performance.now();
            lastTickAngle = startAngle;

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                if (elapsed < duration) {
                    const progress = elapsed / duration;
                    // Cubic Ease-Out
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    
                    currentAngle = startAngle + (targetAngle - startAngle) * easeOut;
                    drawWheel();

                    // Sound and tick marker bounce calculation
                    const sliceAngle = (Math.PI * 2) / entries.length;
                    if (Math.abs(currentAngle - lastTickAngle) >= sliceAngle) {
                        audio.playTick();
                        lastTickAngle = currentAngle;
                        triggerPointerTick();
                    }

                    requestAnimationFrame(animate);
                } else {
                    currentAngle = targetAngle;
                    drawWheel();
                    isSpinning = false;
                    document.getElementById('spinBtn').disabled = false;
                    document.getElementById('centerBtn').disabled = false;
                    
                    calculateWinner();
                }
            }

            requestAnimationFrame(animate);
        }

        function triggerPointerTick() {
            const pointer = document.getElementById('pointerMarker');
            pointer.classList.remove('pointer-tick');
            // Trigger reflow
            void pointer.offsetWidth;
            pointer.classList.add('pointer-tick');
        }

        // Determine Winner based on pointer at Right (0 radians)
        function calculateWinner() {
            const total = entries.length;
            const sliceAngle = (Math.PI * 2) / total;

            // Normalize current angle to [0, 2π)
            let normalizedAngle = currentAngle % (Math.PI * 2);
            if (normalizedAngle < 0) normalizedAngle += Math.PI * 2;

            // Pointer is at right (0 rad), calculate backwards index
            let winningIndex = Math.floor((Math.PI * 2 - normalizedAngle) / sliceAngle) % total;
            if (winningIndex < 0) winningIndex += total;

            lastWinner = entries[winningIndex];
            
            // Record winner
            winners.unshift({
                name: lastWinner,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
            });
            updateWinnersListUI();

            // Celebrate
            audio.playFanfare();
            fireConfetti();
            showWinnerModal(lastWinner);
        }

        function fireConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        function showWinnerModal(name) {
            document.getElementById('winnerNameText').innerText = name;
            const modal = document.getElementById('winnerModal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.firstElementChild.classList.remove('scale-90');
            modal.firstElementChild.classList.add('scale-100');
        }

        function closeWinnerModal() {
            const modal = document.getElementById('winnerModal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.firstElementChild.classList.remove('scale-100');
            modal.firstElementChild.classList.add('scale-90');
        }

        function removeWinnerEntry() {
            if (!lastWinner) return;
            const index = entries.indexOf(lastWinner);
            if (index !== -1) {
                entries.splice(index, 1);
                updateTextareaFromEntries();
                drawWheel();
            }
            closeWinnerModal();
        }

        function handleEntriesChange() {
            const text = document.getElementById('entriesInput').value;
            entries = text.split('\n')
                          .map(e => e.trim())
                          .filter(e => e.length > 0);
            
            document.getElementById('entriesCount').innerText = entries.length;
            drawWheel();
        }

        function updateTextareaFromEntries() {
            document.getElementById('entriesInput').value = entries.join('\n');
            document.getElementById('entriesCount').innerText = entries.length;
        }

        function shuffleEntries() {
            for (let i = entries.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [entries[i], entries[j]] = [entries[j], entries[i]];
            }
            updateTextareaFromEntries();
            drawWheel();
        }

        function sortEntries() {
            entries.sort((a, b) => a.localeCompare(b, 'zh-Hant'));
            updateTextareaFromEntries();
            drawWheel();
        }

        function clearAllEntries() {
            if (confirm("確定要清空目前的所有名單嗎？")) {
                entries = [];
                updateTextareaFromEntries();
                drawWheel();
            }
        }

        function importFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.split(/\r?\n/)
                    .map(l => l.trim())
                    .filter(l => l.length > 0);
                entries = lines;
                updateTextareaFromEntries();
                drawWheel();
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function updateWinnersListUI() {
            const container = document.getElementById('winnersList');
            document.getElementById('winnersCount').innerText = winners.length;

            if (winners.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-slate-400 text-sm">
                        尚未產生任何中獎紀錄
                    </div>
                `;
                return;
            }

            container.innerHTML = winners.map((w, idx) => `
                <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-700/50 border border-slate-100 dark:border-slate-700">
                    <div class="flex items-center gap-3">
                        <span class="w-6 h-6 rounded-full bg-amber-100 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 font-bold text-xs flex items-center justify-center">
                            ${winners.length - idx}
                        </span>
                        <span class="font-bold text-slate-800 dark:text-slate-100">${escapeHtml(w.name)}</span>
                    </div>
                    <span class="text-xs text-slate-400 font-mono">${w.time}</span>
                </div>
            `).join('');
        }

        function clearWinners() {
            if (winners.length === 0) return;
            if (confirm("確定要清除所有中獎歷史紀錄嗎？")) {
                winners = [];
                updateWinnersListUI();
            }
        }

        function exportWinners() {
            if (winners.length === 0) {
                alert("目前沒有可匯出的中獎紀錄。");
                return;
            }
            const content = "序號,姓名,時間\n" + winners.map((w, i) => `${winners.length - i},"${w.name}",${w.time}`).join("\n");
            const blob = new Blob(["\uFEFF" + content], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `lucky_wheel_winners_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function switchTab(tab) {
            const entriesPanel = document.getElementById('entriesPanel');
            const winnersPanel = document.getElementById('winnersPanel');
            const tabEntriesBtn = document.getElementById('tabEntriesBtn');
            const tabWinnersBtn = document.getElementById('tabWinnersBtn');

            if (tab === 'entries') {
                entriesPanel.classList.remove('hidden');
                winnersPanel.classList.add('hidden');
                
                tabEntriesBtn.className = "flex-1 py-2 rounded-lg font-semibold text-sm transition flex items-center justify-center gap-2 bg-slate-100 dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm";
                tabWinnersBtn.className = "flex-1 py-2 rounded-lg font-semibold text-sm transition flex items-center justify-center gap-2 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50";
            } else {
                entriesPanel.classList.add('hidden');
                winnersPanel.classList.remove('hidden');

                tabWinnersBtn.className = "flex-1 py-2 rounded-lg font-semibold text-sm transition flex items-center justify-center gap-2 bg-slate-100 dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm";
                tabEntriesBtn.className = "flex-1 py-2 rounded-lg font-semibold text-sm transition flex items-center justify-center gap-2 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50";
            }
        }

        function openSettingsModal() {
            const modal = document.getElementById('settingsModal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeSettingsModal() {
            const modal = document.getElementById('settingsModal');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function updateSpinDurationVal(val) {
            appSettings.duration = parseInt(val, 10);
            document.getElementById('spinDurationValue').innerText = `${val} 秒`;
        }

        function renderThemePresets() {
            const container = document.getElementById('themePresetContainer');
            container.innerHTML = Object.keys(colorThemes).map(key => {
                const isSelected = key === activeThemeKey;
                const palette = colorThemes[key];
                return `
                    <button onclick="selectTheme('${key}')" class="p-2 rounded-xl border flex items-center justify-between transition ${isSelected ? 'border-rose-500 ring-2 ring-rose-500/20 bg-rose-50/50 dark:bg-rose-950/20' : 'border-slate-200 dark:border-slate-700 hover:border-slate-300'}">
                        <div class="flex h-4 w-20 rounded-full overflow-hidden shadow-inner">
                            ${palette.slice(0, 5).map(c => `<div class="flex-1 h-full" style="background-color:${c}"></div>`).join('')}
                        </div>
                        <span class="text-xs font-semibold capitalize text-slate-600 dark:text-slate-300">${key}</span>
                    </button>
                `;
            }).join('');
        }

        function selectTheme(key) {
            activeThemeKey = key;
            renderThemePresets();
            drawWheel();
        }

        // Sound Toggle Button
        function toggleSound() {
            appSettings.soundEnabled = !appSettings.soundEnabled;
            document.getElementById('soundEffectCheck').checked = appSettings.soundEnabled;
            const icon = document.getElementById('soundIcon');
            if (appSettings.soundEnabled) {
                icon.className = "fa-solid fa-volume-high text-lg";
            } else {
                icon.className = "fa-solid fa-volume-xmark text-lg text-slate-400";
            }
        }

        // Fullscreen Toggle
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Dark Mode Toggle
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateTextareaFromEntries();
            updateWinnersListUI();
            renderThemePresets();
            resizeCanvas();

            window.addEventListener('resize', resizeCanvas);
        });
    </script>
</body>
</html>
